pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("$rootDir/../node_modules/react-native/android")
        }
        maven {
            url = uri("$rootDir/../node_modules/@react-native/gradle-plugin")
        }
    }
}

rootProject.name = 'svproxy'
apply from: file("../node_modules/@react-native/gradle-plugin/src/settings.gradle")
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
