// 纯 Android 项目：AGP + Kotlin + Material Components（Views），无 React Native / Hermes / JS 引擎
buildscript {
    ext {
        // Kotlin 2.2.x 兼容 AGP 8.7.3 / Gradle 8.9，MDC 1.14.0 要求这一套工具链
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
