apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

// 版本号 / 版本名完全由 CI 环境注入，不在源码里硬编码
// 本地无环境时用 git 提交数与 short sha 兜底，仍不写死具体版本
def ciVersionCode = System.getenv("APP_VERSION_CODE") ?: "1"
def ciVersionName = System.getenv("APP_VERSION_NAME") ?: "0.0.0-local"

// 签名密钥从环境密钥注入；未配置时回退到仓库内 debug.keystore（仅本地构建用）
def envKeystore = System.getenv("SIGNING_KEYSTORE") ?: ""
def useReleaseSigning = envKeystore.isNotEmpty() && file(envKeystore).exists()

android {
    namespace "com.svproxy"
    // Android 17 / API 37；AGP 8.7.3 官方只测到 API 35，
    // 由 gradle.properties 的 android.suppressUnsupportedCompileSdk=37,37.0 放行
    compileSdk 37

    defaultConfig {
        applicationId "com.svproxy"
        minSdk 26
        // compileSdk 与 targetSdk 都对齐 Android 17 / API 37
        targetSdk 37
        versionCode ciVersionCode.toInteger()
        versionName ciVersionName
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (useReleaseSigning) {
                storeFile file(envKeystore)
                storeType "JKS"
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // CI 注入 SIGNING_* 时用环境密钥签名，本地回退 debug.keystore
            if (useReleaseSigning) signingConfig signingConfigs.release
            else signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    lintOptions {
        // compileSdk 37 是预览平台，assembleRelease 不必依赖 lintVital 解析 SDK
        checkReleaseBuilds false
        abortOnError false
    }

    // 发行版文件名与仓库名一致，不再叫 sv-douyin.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "short-video-parser.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
            ]
        }
    }
}

dependencies {
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    // FileProvider：下载后用 content:// 交给系统播放器
    implementation("androidx.core:core-ktx:1.13.1")
    // Material 3 Expressive（MDC-Android Views 1.14.0，官方最后一个稳定 Views 版本）
    implementation("com.google.android.material:material:1.14.0")
    implementation("androidx.appcompat:appcompat:1.7.0")
}
