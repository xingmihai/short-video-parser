# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true

# 旧架构（RN 0.76 允许 opt-out；自定义原生模块是 legacy module，留旧架构最稳）
newArchEnabled=false

# JS 引擎：Hermes（RN 0.76 官方默认，体积也更小）
# JSC 同样可用，但无论选哪个引擎，MainApplication.kt 都必须使用
# SoLoader.init(this, OpenSourceMergedSoMapping) 完成 RN 0.76 的合并库映射。
hermesEnabled=true
