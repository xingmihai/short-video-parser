name: 自动预发行

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 同一时刻只允许一个预发行构建；旧的进行中被取消，避免并行产出多个预发行
concurrency:
  group: prerelease
  cancel-in-progress: true

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    environment: prerelease
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      # keystore 路径由「载入签名密钥」步骤写入 GITHUB_ENV（runner context 不能用于 job 级 env）
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' \
            > "$SDK_ROOT/licenses/android-sdk-license"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager || true)"; fi
          if [ -n "$SDKMGR" ] && [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null || true
            for CH in "" "--channel=0" "--channel=1" "--channel=2" "--channel=3"; do
              for PKG in "platforms;android-37" "platforms;android-37.0" "platforms;android-37.1"; do
                if "$SDKMGR" $CH "$PKG" > /dev/null 2>&1; then
                  echo "已安装 $PKG (${CH:-default})"
                  break 2
                fi
              done
            done
            echo "=== 已安装的 37 平台目录 ==="
            ls -d "$SDK_ROOT"/platforms/android-37* 2>/dev/null || true
          else
            echo "sdkmanager 未找到，直接走仓库内的平台准备脚本（含下载兜底）"
          fi
          python3 scripts/prepare-sdk37.py "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v5

      - name: 载入签名密钥
        env:
          JKS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$JKS_B64" ]; then
            KS="${{ runner.temp }}/signing.jks"
            printf '%s' "$JKS_B64" | base64 -d > "$KS"
            echo "SIGNING_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "签名密钥已载入（JKS）"
          else
            echo "未配置 SIGNING_KEYSTORE_BASE64，回退 debug.keystore"
          fi

      # 版本号 / 版本名 / tag 全部自动计算，不硬编码
      - name: 计算版本信息
        id: meta
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=pre-${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=pre-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 编译 Release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ steps.meta.outputs.code }}
          APP_VERSION_NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: 整理产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/short-video-parser.apk
          echo "APK: $(stat -c %s dist/short-video-parser.apk) bytes"

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: prerelease-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # 发行说明只写「本次更新」：直接取本次提交信息
      - name: 生成发行说明
        run: |
          {
            echo '## 本次更新'
            echo
            git log -1 --pretty=%B
          } > /tmp/notes.md
          echo "=== 发行说明 ==="
          cat /tmp/notes.md

      # 预发行前先把所有旧预发行（连同其 tag）删掉，保证仓库里永远只有一个
      - name: 删除之前的预发行
        run: |
          OLD="$(gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName')"
          if [ -z "$OLD" ]; then
            echo "没有旧预发行"
          else
            for t in $OLD; do
              echo "删除旧预发行: $t"
              gh release delete "$t" -y --cleanup-tag || true
            done
          fi

      - name: 创建唯一的预发行
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.name }}
        run: |
          gh release create "$TAG" dist/short-video-parser.apk \
            --prerelease \
            --title "预发行 $VERSION" \
            --notes-file /tmp/notes.md \
            --target "$GITHUB_SHA"
