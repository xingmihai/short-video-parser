name: 构建 Android 安装包

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: '同时发布 GitHub Release（附 APK 与 bundle）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' \
            > "$SDK_ROOT/licenses/android-sdk-license"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager || true)"; fi
          if [ -n "$SDKMGR" ] && [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null || true
          else
            echo "sdkmanager 未找到，交由 Android Gradle Plugin 自动下载所需组件"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: 安装 JS 依赖
        run: npm ci --no-audit --no-fund

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 生成 index.android.bundle（明文 JS，已压缩）
        run: |
          set -o pipefail
          mkdir -p android/app/src/main/assets
          ./node_modules/.bin/react-native bundle \
            --platform android \
            --dev false \
            --minify true \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --sourcemap-output android/app/src/main/assets/index.android.bundle.map \
            2>&1 | tee /tmp/bundle.log
          ls -lh android/app/src/main/assets/index.android.bundle
          mkdir -p dist
          cp android/app/src/main/assets/index.android.bundle dist/index.android.bundle
          cp android/app/src/main/assets/index.android.bundle.map dist/index.android.bundle.map
          # 移除源码目录副本，避免与 Gradle 生成的同名 asset 重复
          rm -f android/app/src/main/assets/index.android.bundle android/app/src/main/assets/index.android.bundle.map

      - name: 编译 Release APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: 整理产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/sv-proxy-android.apk
          if [ ! -f dist/index.android.bundle ]; then
            B=$(find android/app/build -name index.android.bundle -type f 2>/dev/null | head -1)
            [ -n "$B" ] && cp "$B" dist/index.android.bundle
          fi
          echo "=== 产物 ==="
          ls -lh dist/
          echo "=== APK 签名校验 ==="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs dist/sv-proxy-android.apk | head -8; fi

      - name: 压缩产物（deflate -9）
        run: |
          cd dist
          zip -9 -q sv-proxy-android-release.zip \
            sv-proxy-android.apk index.android.bundle index.android.bundle.map
          cd ..
          echo "=== 压缩结果 ==="
          ls -lh dist/
          echo "APK: $(stat -c %s dist/sv-proxy-android.apk) bytes"
          echo "ZIP: $(stat -c %s dist/sv-proxy-android-release.zip) bytes"
          echo "bundle: $(stat -c %s dist/index.android.bundle) bytes"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sv-proxy-android-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.0-build{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('sv-proxy-android build {0}', github.run_number) }}
          body: |
            Android 安装包，由 GitHub Actions 自动构建。

            - `sv-proxy-android.apk`：已签名，可直接安装（R8 + 资源压缩 + so deflate）
            - `index.android.bundle`：明文 JS（已 minify），可自行替换后重打包
            - `index.android.bundle.map`：sourcemap
            - `sv-proxy-android-release.zip`：三件套打包，deflate -9

            App 启动后在 8080 端口提供本地代理网关。
          files: |
            dist/*.apk
            dist/*.zip
            dist/index.android.bundle
            dist/index.android.bundle.map
          draft: false
          prerelease: false

      # 失败时把构建日志回传到 ci-debug 分支，便于排查（不污染 main）
      - name: 回传构建日志
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-debug
          cp /tmp/bundle.log ci-debug/bundle.log 2>/dev/null || true
          cp /tmp/gradle.log ci-debug/gradle.log 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-debug/ || true
          git -c commit.gpgsign=false commit -m "ci: 构建失败日志" || echo "无新增日志"
          git push -f origin HEAD:ci-debug || true
