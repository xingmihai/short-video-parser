name: 构建 Android 安装包

on:
  push:
    # 只在打 tag 时构建；push 到 main 不再触发，避免 main + tag 两次重复构建
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: '同时发布 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' \
            > "$SDK_ROOT/licenses/android-sdk-license"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager || true)"; fi
          if [ -n "$SDKMGR" ] && [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null || true
            # Android 17 平台稳定 channel 未必有，依次试 channel 0-3 与带小版本的包名
            for CH in "" "--channel=0" "--channel=1" "--channel=2" "--channel=3"; do
              for PKG in "platforms;android-37" "platforms;android-37.0" "platforms;android-37.1"; do
                if "$SDKMGR" $CH "$PKG" > /dev/null 2>&1; then
                  echo "已安装 $PKG (${CH:-default})"
                  break 2
                fi
              done
            done
            echo "=== 已安装的 37 平台目录 ==="
            ls -d "$SDK_ROOT"/platforms/android-37* 2>/dev/null || true
            "$SDKMGR" --list --channel=1 2>/dev/null | grep -i "android-37" | head -10 || true
          else
            echo "sdkmanager 未找到，直接走仓库内的平台准备脚本（含下载兜底）"
          fi
          # AGP 8.x 只认 platforms;android-37 这个 hash，统一整理目录与元数据
          python3 scripts/prepare-sdk37.py "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 校验 Material 3 Expressive UI 资源
        run: python3 scripts/check-m3-ui.py

      - name: 编译 Release APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: 整理产物 + 校验纯 Kotlin
        run: |
          set -o pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/short-video-parser.apk
          python3 scripts/check-no-bundle.py dist/short-video-parser.apk 2>&1 | tee /tmp/nobundle.log
          echo "=== 产物 ==="
          ls -lh dist/
          echo "=== APK 签名校验 ==="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs dist/short-video-parser.apk | head -8; fi
          echo "APK: $(stat -c %s dist/short-video-parser.apk) bytes"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: short-video-parser-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # 发行说明只写「本次更新」：直接取本次提交信息，不重复罗列功能/平台/用法
      - name: 生成发行说明
        id: notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        run: |
          {
            echo 'text<<NOTES_EOF'
            echo '## 本次更新'
            echo
            git log -1 --pretty=%B
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v3.3.0-build{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('short-video-parser build {0}', github.run_number) }}
          body: ${{ steps.notes.outputs.text }}
          files: dist/short-video-parser.apk
          draft: false
          prerelease: false

      # 失败时把构建日志回传到 ci-debug 分支，便于排查（不污染 main）
      - name: 回传构建日志
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-debug
          cp /tmp/gradle.log ci-debug/gradle.log 2>/dev/null || true
          cp /tmp/nobundle.log ci-debug/nobundle.log 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-debug/ || true
          git -c commit.gpgsign=false commit -m "ci: 构建失败日志" || echo "无新增日志"
          git push -f origin HEAD:ci-debug || true
