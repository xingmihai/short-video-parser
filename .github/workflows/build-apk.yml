name: 构建 Android 安装包

on:
  push:
    # 只在打 tag 时构建；push 到 main 由「自动预发行」工作流负责，避免重复构建
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      # 签名配置来自仓库环境密钥；keystore 路径由「载入签名密钥」步骤写入 GITHUB_ENV
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' \
            > "$SDK_ROOT/licenses/android-sdk-license"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager || true)"; fi
          if [ -n "$SDKMGR" ] && [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null || true
            for CH in "" "--channel=0" "--channel=1" "--channel=2" "--channel=3"; do
              for PKG in "platforms;android-37" "platforms;android-37.0" "platforms;android-37.1"; do
                if "$SDKMGR" $CH "$PKG" > /dev/null 2>&1; then
                  echo "已安装 $PKG (${CH:-default})"
                  break 2
                fi
              done
            done
            echo "=== 已安装的 37 平台目录 ==="
            ls -d "$SDK_ROOT"/platforms/android-37* 2>/dev/null || true
            "$SDKMGR" --list --channel=1 2>/dev/null | grep -i "android-37" | head -10 || true
          else
            echo "sdkmanager 未找到，直接走仓库内的平台准备脚本（含下载兜底）"
          fi
          python3 scripts/prepare-sdk37.py "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 校验 Material 3 Expressive UI 资源
        run: python3 scripts/check-m3-ui.py

      - name: 载入签名密钥
        env:
          JKS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$JKS_B64" ]; then
            KS="${{ runner.temp }}/signing.jks"
            printf '%s' "$JKS_B64" | base64 -d > "$KS"
            echo "SIGNING_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "签名密钥已载入（JKS）"
          else
            echo "未配置 SIGNING_KEYSTORE_BASE64，回退 debug.keystore"
          fi

      # 版本号 / 版本名全部由 CI 计算，源码里不写死
      - name: 计算版本信息
        id: meta
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=build-${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: 编译 Release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ steps.meta.outputs.code }}
          APP_VERSION_NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: 整理产物 + 校验纯 Kotlin + 校验签名
        run: |
          set -o pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/short-video-parser.apk
          python3 scripts/check-no-bundle.py dist/short-video-parser.apk 2>&1 | tee /tmp/nobundle.log
          bash scripts/verify-signature.sh dist/short-video-parser.apk
          echo "=== 产物 ==="
          ls -lh dist/
          echo "APK: $(stat -c %s dist/short-video-parser.apk) bytes"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: short-video-parser-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # 正式发行版不再自动发布：只出构建产物，正式 Release 由人工在 GitHub 上发布

      # 失败时把构建日志回传到 ci-debug 分支，便于排查（不污染 main）
      - name: 回传构建日志
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-debug
          cp /tmp/gradle.log ci-debug/gradle.log 2>/dev/null || true
          cp /tmp/nobundle.log ci-debug/nobundle.log 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-debug/ || true
          git -c commit.gpgsign=false commit -m "ci: 构建失败日志" || echo "无新增日志"
          git push -f origin HEAD:ci-debug || true
